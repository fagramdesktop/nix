name: Prebuilt Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tagname:
        description: "Release tag (e.g. v2.5.7)"
        type: string
        required: false
      disable_cache:
        description: "Skip restore cache (rebuild from source)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build from Source & Release
    runs-on: ubuntu-latest

    steps:
      - name: Set TAGNAME
        id: tagname
        run: |
          if [ -n "${{ inputs.tagname }}" ]; then
            TAGNAME="${{ inputs.tagname }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAGNAME="${GITHUB_REF#refs/tags/}"
          else
            TAGNAME="v2.5.7"
          fi
          echo "TAGNAME=$TAGNAME" >> $GITHUB_ENV
          echo "tagname=$TAGNAME" >> $GITHUB_OUTPUT

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up ccache
        run: |
          curl -sSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz \
          | sudo tar xJ -C /usr/local/bin --strip-components=1 ccache-4.13.6-linux-x86_64-glibc/ccache
          mkdir -p "$RUNNER_TEMP/.tdesktop-cache"
          echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> $GITHUB_ENV

      - name: Restore FAgram cache
        id: cache-tdesktop
        if: ${{ inputs.disable_cache != true && inputs.disable_cache != 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.OS }}-tdesktop-${{ github.run_id }}
          restore-keys: ${{ runner.OS }}-tdesktop-

      - name: Install Nix
        uses: cachix/install-nix-action@master
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-sandbox-paths = /var/cache/ccache?=${{ env.CCACHE_DIR }}

      - name: Magic Nix Cache
        if: ${{ inputs.disable_cache != true && inputs.disable_cache != 'true' }}
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build FAgram Desktop from Source
        run: |
          mkdir -p ${{ env.CCACHE_DIR }}
          ccache -z
          nix build .#source --print-build-logs

      - name: Count ccache misses
        id: ccache-stats
        if: ${{ inputs.disable_cache != true && inputs.disable_cache != 'true' }}
        run: |
          MISSES=$(ccache --print-stats | sed -n 's/^cache_miss\t//p' | head -1)
          case "$MISSES" in (*[!0-9]*|'') MISSES=0;; esac
          echo "misses=$MISSES" >> $GITHUB_OUTPUT
          echo "ccache misses this run: $MISSES"

      - name: Trim Telegram Desktop cache
        if: >
          inputs.disable_cache != true
            && inputs.disable_cache != 'true'
            && fromJSON(steps.ccache-stats.outputs.misses) > 300
        run: ccache --evict-older-than 1d

      - name: Save Telegram Desktop cache
        if: >
          inputs.disable_cache != true
            && inputs.disable_cache != 'true'
            && fromJSON(steps.ccache-stats.outputs.misses) > 300
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.cache-tdesktop.outputs.cache-primary-key }}

      - name: Package Release Archive (Zstandard Ultra)
        run: |
          mkdir -p dist
          ARCHIVE_NAME="fagram-desktop-${{ env.TAGNAME }}-x86_64-linux.tar.zst"
          echo "Archiving Nix result into dist/$ARCHIVE_NAME..."
          tar -I 'zstd -T0 --ultra -22' -cvf "dist/$ARCHIVE_NAME" -C result .
          ls -lh "dist/$ARCHIVE_NAME"

          HASH=$(nix hash file "dist/$ARCHIVE_NAME")
          echo "================================================="
          echo "Release Archive: $ARCHIVE_NAME"
          echo "Nix SRI Hash:    $HASH"
          echo "================================================="
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV
          echo "ARCHIVE_HASH=$HASH" >> $GITHUB_ENV
          echo "$HASH" > "dist/$ARCHIVE_NAME.sha256"
          echo "ARCHIVE_PATH=dist/$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAGNAME }}
          name: "FAgram Desktop ${{ env.TAGNAME }}"
          body: |
            Official FAgram Desktop prebuilt release built natively from source via Nix CI.
            Archive: `${{ env.ARCHIVE_NAME }}`
            Nix SRI Hash: `${{ env.ARCHIVE_HASH }}`
          files: |
            dist/fagram-desktop-*.tar.zst
            dist/fagram-desktop-*.tar.zst.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
